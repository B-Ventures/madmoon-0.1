<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .primary { fill: #047857; }
    .secondary { fill: #1E2337; }
    @media (prefers-color-scheme: dark) {
      .primary { fill: #FFFFFF; }
      .secondary { fill: #FFFFFF; }
    }
  </style>
  <!-- Madmoon Official Logo Mark with Adaptive Dark Mode Support -->
  <g fill="none" fill-rule="evenodd">
    <!-- Main Checkmark -->
    <path class="primary" d="M15 38 L40 63 L85 18 L85 34 L40 79 L15 54 Z" />
    
    <!-- Bottom Left Accent Triangle -->
    <polygon class="secondary" points="15,66 15,85 34,85" />
    
    <!-- Bottom Right Diagonal Bar 1 -->
    <polygon class="secondary" points="48,85 85,48 85,63 63,85" />
    
    <!-- Bottom Right Diagonal Bar 2 -->
    <polygon class="secondary" points="73,85 85,73 85,85" />
  </g>
</svg>
